<div class="card shadow p-4 mt-4 w-75 mx-auto">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold m-0">Pacientes del Medico {{ codmed }}</h4>
    <a [routerLink]="['/registro-paciente', codmed, costoBase]" class="text-primary fw-bold text-decoration-underline">Nuevos Pacientes</a>
  </div>
  
  <table class="table table-bordered table-striped text-center">
    <thead class="table-light">
      <tr>
        <th>Codigo</th>
        <th>Nombre</th>
        <th>tipo</th>
        <th>pago</th>
        <th>Anular</th>
      </tr>
    </thead>
    <tbody>
      @for (cita of citas; track cita.nrocita) {
        <tr>
          <td>{{ cita.nrocita }}</td>
          <td>{{ cita.nompac }}</td>
          <td>{{ cita.tipo }}</td>
          <td>{{ cita.pago | number:'1.1-2' }}</td>
          <td><a href="javascript:void(0)" (click)="anular(cita.nrocita)" class="text-primary text-decoration-underline">del</a></td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">No hay citas registradas para este médico.</td>
        </tr>
      }
    </tbody>
  </table>
  <a [routerLink]="['/especialidades']" class="btn btn-secondary mt-2 w-25">Volver al Inicio</a>
</div>
